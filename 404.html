<!DOCTYPE html>
<!--
  ============================================================================
  EXPANDING ENGLISH — Página 404 ("página não encontrada")
  ============================================================================
  O GitHub Pages (e a maioria das hospedagens estáticas) exibe este arquivo
  quando alguém acessa um endereço que não existe no site.

  ATENÇÃO AOS CAMINHOS: como esta página pode ser aberta a partir de qualquer
  endereço, os caminhos começam com "/" (a partir da raiz do domínio). Isso
  funciona com domínio próprio (expandingenglish.com.br) ou com o endereço
  usuario.github.io. Se o site for publicado em usuario.github.io/NOME-DO-REPO/
  (com subpasta), troque "/" por "/NOME-DO-REPO/" nos caminhos abaixo.

  Fica fora dos resultados do Google (noindex).
  ============================================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B3459">
  <title>Página não encontrada — Expanding English</title>
  <link rel="icon" type="image/png" href="/images/icon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    /* Mesmas cores e fontes do site (ver css/styles.css) */
    :root{--cyan:#00D7F1;--navy-deep:#0B3459;--navy-deeper:#082A47;}
    *{box-sizing:border-box;}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:32px 24px;text-align:center;color:#fff;
      font-family:'Manrope',sans-serif;font-size:17px;line-height:1.6;
      background:linear-gradient(180deg,var(--navy-deeper),var(--navy-deep));
      -webkit-font-smoothing:antialiased;
    }
    main{max-width:520px;}
    img{display:block;margin:0 auto 36px;height:36px;width:auto;}
    .code{font-family:'Staatliches',sans-serif;font-size:96px;line-height:1;color:var(--cyan);margin:0 0 8px;}
    h1{font-family:'Staatliches',sans-serif;font-weight:400;text-transform:uppercase;font-size:34px;line-height:1.1;margin:0 0 16px;}
    p{margin:0 0 32px;color:rgba(255,255,255,.82);}
    .btn{
      display:inline-block;background:var(--cyan);color:var(--navy-deeper);text-decoration:none;
      font-weight:700;font-size:15px;padding:15px 30px;border-radius:999px;
    }
    .btn:focus-visible{outline:3px solid #fff;outline-offset:3px;}
  </style>
</head>
<body>
  <main>
    <img src="/images/logo-dark.png" alt="Expanding English" width="480" height="136">
    <div class="code" aria-hidden="true">404</div>
    <h1>Essa página não existe</h1>
    <p>O endereço pode ter mudado ou estar digitado errado. Volte ao início e descubra qual é o seu perfil de trava.</p>
    <a class="btn" href="/">Voltar ao início</a>
  </main>
</body>
</html>
